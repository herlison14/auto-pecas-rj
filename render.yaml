services:
  - type: web
    name: sellsync-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    branch: claude/upseller-platform-analysis-n10NA
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEB_URL
        sync: false
