name: Deploy SellSync Web → Vercel

on:
  push:
    branches:
      - claude/upseller-platform-analysis-n10NA
      - main
  workflow_dispatch:
    inputs:
      vercel_token:
        description: 'Vercel token (sobrepõe o secret VERCEL_TOKEN)'
        required: false
      vercel_project:
        description: 'Nome do projeto no Vercel'
        required: false
        default: 'herlison14-sellsync'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ github.event.inputs.vercel_token || secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: ${{ github.event.inputs.vercel_project || 'herlison14-sellsync' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN vazio. Configure o secret VERCEL_TOKEN no repositório ou rode via workflow_dispatch passando o input vercel_token."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: apps/web

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: vercel link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"
        working-directory: apps/web

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        working-directory: apps/web

      - name: Build project
        run: vercel build --prod --token "$VERCEL_TOKEN"
        working-directory: apps/web

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed: $URL"
        working-directory: apps/web
