name: Deploy SellSync Web → Vercel

on:
  push:
    branches:
      - claude/upseller-platform-analysis-n10NA
      - main
  workflow_dispatch:
    inputs:
      vercel_project:
        description: 'Nome do projeto no Vercel'
        required: false
        default: 'herlison14-sellsync'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: ${{ github.event.inputs.vercel_project || 'herlison14-sellsync' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN não configurado no repositório (Settings → Secrets → Actions)."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: vercel link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"
        working-directory: apps/web

      # Build remoto nos servidores do Vercel: usa as env vars do painel
      # (NEXT_PUBLIC_API_URL) e evita problemas de hoisting do monorepo no CI.
      - name: Deploy to Vercel (remote build)
        id: deploy
        run: |
          URL=$(vercel deploy --prod --token "$VERCEL_TOKEN")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed: $URL"
        working-directory: apps/web
