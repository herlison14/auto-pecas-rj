name: Diagnose Production

on:
  workflow_dispatch:
  push:
    branches:
      - claude/upseller-platform-analysis-n10NA
    paths:
      - '.diagnose-trigger'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Proxy /backend/healthz via Vercel (prova build novo + proxy)
        run: |
          echo "=== GET https://herlison14-sellsync.vercel.app/backend/healthz ==="
          curl -si --max-time 120 https://herlison14-sellsync.vercel.app/backend/healthz | head -20

      - name: 2. Registro end-to-end via proxy
        run: |
          echo "=== POST /backend/auth/register via Vercel ==="
          curl -si -X POST https://herlison14-sellsync.vercel.app/backend/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"tenantName\":\"Probe CI\",\"name\":\"Probe\",\"email\":\"probe-$(date +%s)@example.com\",\"password\":\"Probe12345!\"}" \
            --max-time 120 | head -40

      - name: 3. API direta (Render) — healthz e registro
        run: |
          echo "=== GET /healthz direto ==="
          curl -si --max-time 120 https://auto-pecas-rj.onrender.com/healthz | head -5
          echo ""
          echo "=== POST /auth/register direto ==="
          curl -si -X POST https://auto-pecas-rj.onrender.com/auth/register \
            -H "Origin: https://herlison14-sellsync.vercel.app" \
            -H "Content-Type: application/json" \
            -d "{\"tenantName\":\"Probe Direct\",\"name\":\"Probe\",\"email\":\"probe-direct-$(date +%s)@example.com\",\"password\":\"Probe12345!\"}" \
            --max-time 120 | tail -5
